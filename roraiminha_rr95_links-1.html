<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roraiminha RR95</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: #fff;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 36px 24px;
      border-radius: 24px;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: #2563eb;
      font-size: 32px;
      font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 26px; opacity: .85; }
    a {
      display: block;
      text-decoration: none;
      color: #111827;
      background: #fff;
      margin: 14px 0;
      padding: 16px 20px;
      border-radius: 14px;
      font-weight: 700;
      transition: transform .2s, box-shadow .2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
    }
    .footer { margin-top: 22px; font-size: 12px; opacity: .65; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">RR</div>
    <h1>Roraiminha RR95</h1>
    <p>Minhas redes sociais 👇</p>

    <a href="https://www.instagram.com/roraiminharr95" target="_blank" rel="noopener">
      📸 Instagram
    </a>

    <a href="https://www.facebook.com/RoraiminhaRR95" target="_blank" rel="noopener">
      📘 Facebook
    </a>

    <div class="footer">© Roraiminha RR95</div>
  </main>
</body>
</html>
